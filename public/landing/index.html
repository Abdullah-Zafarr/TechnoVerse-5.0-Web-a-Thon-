<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamGuard — Secure Examination Platform</title>
  <meta name="description" content="ExamGuard delivers role-isolated exam authoring, live candidate monitoring, automated grading, and QR-verified transcripts.">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B2A4A'/%3E%3Cpath d='M16 5L22 11L16 17L10 11Z' fill='%23FF8C2B'/%3E%3Crect x='9' y='20' width='14' height='6' rx='3' fill='%23E8D8B9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/landing/styles.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="#top" class="brand-lockup" aria-label="ExamGuard home">
        <svg class="brand-diamond" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M6 0.5L11.5 6L6 11.5L0.5 6Z" fill="#FF8C2B"/>
        </svg>
        <span class="brand-word">EXAMGUARD</span>
      </a>

      <div class="header-actions">
        <a
          href="/portal"
          class="try-pill"
          data-product-link
        >
          <span>Try Our Product</span>
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3.75 9H14.25M14.25 9L9.75 4.5M14.25 9L9.75 13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="hero" id="top" aria-label="ExamGuard secure examination platform">
      <!-- Subtle architectural background accents -->
      <div class="hero-bg" aria-hidden="true">
        <div class="hero-bg-band"></div>
        <svg class="hero-bg-mesh" viewBox="0 0 420 260" fill="none">
          <g stroke="rgba(232, 216, 185, 0.12)" stroke-width="1">
            <line x1="24" y1="240" x2="98" y2="174" />
            <line x1="98" y1="174" x2="178" y2="212" />
            <line x1="98" y1="174" x2="124" y2="96" />
            <line x1="124" y1="96" x2="214" y2="128" />
            <line x1="214" y1="128" x2="178" y2="212" />
            <line x1="214" y1="128" x2="296" y2="188" />
            <line x1="178" y1="212" x2="296" y2="188" />
            <line x1="124" y1="96" x2="48" y2="112" />
            <line x1="48" y1="112" x2="24" y2="240" />
            <line x1="24" y1="240" x2="178" y2="212" />
            <line x1="296" y1="188" x2="368" y2="248" />
          </g>
          <g fill="rgba(232, 216, 185, 0.28)">
            <circle cx="24" cy="240" r="2.5" />
            <circle cx="98" cy="174" r="3" />
            <circle cx="178" cy="212" r="2.5" />
            <circle cx="124" cy="96" r="2.5" />
            <circle cx="214" cy="128" r="2.5" />
            <circle cx="296" cy="188" r="2" />
            <circle cx="48" cy="112" r="2" />
          </g>
        </svg>
      </div>

      <div class="hero-inner">
        <div class="hero-left">
          <h1 class="hero-title">
            <span class="hero-word hero-word--sand">EXAM</span>
            <span class="hero-word hero-word--tangerine">GUARD</span>
          </h1>

          <p class="hero-lead">
            Run timed online exams, monitor active students in real time, and issue verified score reports.
          </p>

          <div class="hero-actions">
            <a
              href="/portal"
              class="hero-cta"
              data-product-link
            >Get Started</a>
          </div>
        </div>

        <div class="hero-right">
          <div class="hero-stage">
            <svg
              class="hero-emblem-svg"
              viewBox="0 0 560 490"
              role="img"
              aria-label="Illustration of a Cream Sand and Tangerine fountain pen tucked behind a locked security padlock"
            >
              <defs>
                <filter id="obj-shadow-blur" x="-30%" y="-20%" width="160%" height="150%">
                  <feGaussianBlur stdDeviation="9" />
                </filter>

                <clipPath id="lock-body-clip">
                  <rect x="-78" y="-26" width="156" height="136" rx="22" />
                </clipPath>

                <clipPath id="pen-barrel-clip">
                  <path d="M -21 -162 C -21 -176, 21 -176, 21 -162 L 21 142 L 14 196 L 0 234 L -14 196 L -21 142 Z" />
                </clipPath>

                <pattern id="emblem-grid" width="24" height="24" patternUnits="userSpaceOnUse">
                  <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(232, 216, 185, 0.08)" stroke-width="1" />
                </pattern>

                <radialGradient id="grid-fade" cx="50%" cy="50%" r="50%">
                  <stop offset="35%" stop-color="#fff" stop-opacity="1" />
                  <stop offset="100%" stop-color="#fff" stop-opacity="0" />
                </radialGradient>

                <mask id="emblem-grid-mask">
                  <rect x="60" y="20" width="440" height="440" fill="url(#grid-fade)" />
                </mask>
              </defs>

              <!-- Quiet geometric backdrop behind Pen + Lock -->
              <g aria-hidden="true">
                <rect x="60" y="20" width="440" height="440" fill="url(#emblem-grid)" mask="url(#emblem-grid-mask)" />
                <circle cx="295" cy="240" r="138" fill="none" stroke="rgba(232, 216, 185, 0.08)" stroke-width="1" />
                <circle cx="295" cy="240" r="186" fill="none" stroke="rgba(232, 216, 185, 0.06)" stroke-width="1" />
                <circle cx="295" cy="240" r="234" fill="none" stroke="rgba(232, 216, 185, 0.04)" stroke-width="1" />

                <!-- Small dot matrix (upper-left & upper-right) -->
                <g fill="rgba(232, 216, 185, 0.24)">
                  <circle cx="118" cy="146" r="2" /><circle cx="130" cy="146" r="2" /><circle cx="142" cy="146" r="2" /><circle cx="154" cy="146" r="2" />
                  <circle cx="118" cy="158" r="2" /><circle cx="130" cy="158" r="2" /><circle cx="142" cy="158" r="2" /><circle cx="154" cy="158" r="2" />
                  <circle cx="118" cy="170" r="2" /><circle cx="130" cy="170" r="2" /><circle cx="142" cy="170" r="2" /><circle cx="154" cy="170" r="2" />

                  <circle cx="446" cy="94" r="2" /><circle cx="458" cy="94" r="2" /><circle cx="470" cy="94" r="2" /><circle cx="482" cy="94" r="2" />
                  <circle cx="446" cy="106" r="2" /><circle cx="458" cy="106" r="2" /><circle cx="470" cy="106" r="2" /><circle cx="482" cy="106" r="2" />
                  <circle cx="446" cy="118" r="2" /><circle cx="458" cy="118" r="2" /><circle cx="470" cy="118" r="2" /><circle cx="482" cy="118" r="2" />
                </g>

                <!-- Minimalist security shield badge -->
                <g transform="translate(454, 184)">
                  <rect x="-20" y="-20" width="40" height="40" rx="10" fill="rgba(18, 30, 54, 0.55)" stroke="rgba(232, 216, 185, 0.18)" stroke-width="1" />
                  <path d="M 0 -10 L 8 -6 V 1 C 8 6.5, 4.5 10.5, 0 12 C -4.5 10.5, -8 6.5, -8 1 V -6 Z" fill="none" stroke="#FF8C2B" stroke-width="1.6" stroke-linejoin="round" />
                  <path d="M -3.2 1 L -0.8 3.5 L 4 -1.5" fill="none" stroke="#E8D8B9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </g>

                <!-- Minimalist verified check badge -->
                <g transform="translate(132, 248)">
                  <circle cx="0" cy="0" r="16" fill="rgba(18, 30, 54, 0.55)" stroke="rgba(232, 216, 185, 0.18)" stroke-width="1" />
                  <path d="M -4.5 0.5 L -1.2 3.8 L 5 -3" fill="none" stroke="#FF8C2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </g>
              </g>

              <g transform="translate(280, 240) scale(1.18) translate(-280, -240)">
                <!-- Exam Pen (rendered FIRST so it sits behind the padlock, full nib visible below) -->
                <g transform="translate(258, 232) rotate(-32)">
                  <!-- Soft ambient shadow -->
                  <g transform="translate(-8, 14)" opacity="0.72" filter="url(#obj-shadow-blur)">
                    <path d="M -21 -162 C -21 -176, 21 -176, 21 -162 L 21 142 L 14 196 L 0 234 L -14 196 L -21 142 Z" fill="#111C33" />
                  </g>
                  <g transform="translate(-3, 6)" opacity="0.46">
                    <path d="M -21 -162 C -21 -176, 21 -176, 21 -162 L 21 142 L 14 196 L 0 234 L -14 196 L -21 142 Z" fill="#111C33" />
                  </g>

                  <!-- Pen Body -->
                  <path
                    d="M -21 -162 C -21 -176, 21 -176, 21 -162 L 21 142 L 14 196 L 0 234 L -14 196 L -21 142 Z"
                    fill="#F3EAD8"
                  />

                  <!-- Warm Sand grip section -->
                  <rect x="-24" y="110" width="48" height="34" fill="#CBB692" clip-path="url(#pen-barrel-clip)" />

                  <!-- Tangerine cap & grip rings -->
                  <rect x="-24" y="-178" width="48" height="28" fill="#FF8C2B" clip-path="url(#pen-barrel-clip)" />
                  <rect x="-24" y="-68" width="48" height="10" fill="#FF8C2B" clip-path="url(#pen-barrel-clip)" />
                  <rect x="-24" y="138" width="48" height="8" fill="#C75D0A" clip-path="url(#pen-barrel-clip)" />

                  <!-- Nib -->
                  <path d="M -15 146 L 15 146 L 14 196 L 0 234 L -14 196 Z" fill="#E8D8B9" />
                  <path d="M 0 234 L 0 176" stroke="#121E36" stroke-width="2.5" stroke-linecap="round" />
                  <circle cx="0" cy="172" r="4.5" fill="#121E36" />

                  <!-- Pocket clip -->
                  <rect x="18" y="-154" width="9" height="82" rx="4.5" fill="#FF8C2B" />
                  <circle cx="22.5" cy="-76" r="4.5" fill="#C75D0A" />
                </g>

                <!-- Padlock (rendered SECOND so it sits in front of the pen) -->
                <g transform="translate(316, 238) rotate(6)">
                  <!-- Soft ambient shadow -->
                  <g transform="translate(6, 14)" opacity="0.78" filter="url(#obj-shadow-blur)">
                    <path d="M -46 -24 V -68 C -46 -104, 46 -104, 46 -68 V -24" fill="none" stroke="#111C33" stroke-width="24" stroke-linecap="round" />
                    <rect x="-78" y="-26" width="156" height="136" rx="22" fill="#111C33" />
                  </g>
                  <g transform="translate(3, 5)" opacity="0.52">
                    <rect x="-78" y="-26" width="156" height="136" rx="22" fill="#111C33" />
                  </g>

                  <!-- Shackle -->
                  <path
                    d="M -46 -22 V -68 C -46 -106, 46 -106, 46 -68 V -22"
                    fill="none"
                    stroke="#FF8C2B"
                    stroke-width="24"
                    stroke-linecap="round"
                  />
                  <!-- Shackle inner highlight -->
                  <path
                    d="M -38 -28 V -67 C -38 -95, 38 -95, 38 -67 V -28"
                    fill="none"
                    stroke="#F3EAD8"
                    stroke-opacity="0.28"
                    stroke-width="3"
                    stroke-linecap="round"
                  />
                  <!-- Shackle collars -->
                  <rect x="-60" y="-32" width="28" height="10" rx="4" fill="#C75D0A" />
                  <rect x="32" y="-32" width="28" height="10" rx="4" fill="#C75D0A" />

                  <!-- Lock Body -->
                  <rect x="-78" y="-26" width="156" height="136" rx="22" fill="#F3EAD8" />
                  <!-- Lower Warm Heel Sand bevel -->
                  <path
                    d="M -84 56 Q 0 72 84 56 L 84 120 L -84 120 Z"
                    fill="#CBB692"
                    clip-path="url(#lock-body-clip)"
                  />
                  <path
                    d="M -84 56 Q 0 72 84 56"
                    fill="none"
                    stroke="#B8A17A"
                    stroke-width="1.5"
                    opacity="0.45"
                    clip-path="url(#lock-body-clip)"
                  />

                  <!-- Tangerine accent band -->
                  <rect x="-78" y="-8" width="156" height="10" fill="#FF8C2B" clip-path="url(#lock-body-clip)" />

                  <!-- Keyhole recess -->
                  <circle cx="0" cy="36" r="15" fill="#121E36" />
                  <path d="M -7 44 L 7 44 L 11 74 H -11 Z" fill="#121E36" />
                  <circle cx="0" cy="36" r="19" fill="none" stroke="#CBB692" stroke-width="2" />
                </g>
              </g>
            </svg>
          </div>

          <a
            href="/portal"
            class="hero-stamp"
            data-product-link
            aria-label="Launch live ExamGuard platform"
          >
            <span>LIVE</span>
            <span>PLATFORM</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="/landing/script.js"></script>
</body>
</html>
